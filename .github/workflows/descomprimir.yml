name: Descomprimir sitio
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No hay ningún .zip en la raíz"; exit 1; fi
          for z in "${zips[@]}"; do unzip -o "$z"; rm "$z"; done
          rm -f assets/leeme
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Subir sitio completo" || echo "Sin cambios"
          git push
