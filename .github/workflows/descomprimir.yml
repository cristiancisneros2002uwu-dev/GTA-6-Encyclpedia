name: Descomprimir sitio
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o gta6encyclopedia-site.zip
          rm gta6encyclopedia-site.zip
          rm -f assets/leeme
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Subir sitio completo"
          git push
