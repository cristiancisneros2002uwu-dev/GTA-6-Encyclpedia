<style>
:root{--bg:#1A1030;--card:#271A47;--card2:#2F2055;--line:#43326F;--ink:#FFF1EA;--mute:#C3AFCB;--a:#FF6B8B;--b:#FFB36B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 Figtree,system-ui,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(180deg,#22143f,#1A1030);border-bottom:1px solid var(--line);z-index:1000}
header a.back{color:var(--b);text-decoration:none;font-weight:700;font-size:22px;line-height:1;padding:2px 6px}
header .ttl{margin:0;font:800 18px/1.1 "Bricolage Grotesque",Figtree,sans-serif;white-space:nowrap}
header .ttl small{display:block;font:500 12px/1.2 Figtree,sans-serif;color:var(--mute)}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 15px Figtree,sans-serif;outline:none}
.search input:focus{border-color:var(--b)}
.results{position:absolute;left:0;right:0;top:46px;max-height:55vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.45);display:none}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:10px 12px;font:500 14px Figtree,sans-serif;cursor:pointer}
.results button small{color:var(--mute);display:block;font-size:12px}
.results button:hover{background:var(--card2)}
#map{flex:1;background:#1d3c6b}
.fab{position:absolute;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:1000;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:99px;border:0;background:var(--a);color:#2A0A18;font:800 15px Figtree,sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.45);cursor:pointer}
.fab b{background:#2A0A18;color:var(--a);border-radius:99px;padding:1px 8px;font-size:13px}
.note{position:absolute;left:12px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:999;max-width:52%;background:rgba(26,16,48,.86);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;color:var(--mute)}
#panel{position:absolute;z-index:1001;right:0;top:0;bottom:0;width:340px;max-width:100%;background:var(--bg);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel .ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
#panel .ph h2{margin:0;font:800 18px "Bricolage Grotesque",sans-serif}
#panel .ph button{background:none;border:0;color:var(--ink);font-size:26px;cursor:pointer}
#panel .all{display:flex;gap:8px;padding:10px 16px}
#panel .all button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px Figtree,sans-serif;cursor:pointer}
#cats{overflow:auto;padding:4px 10px 24px}
.cat{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;cursor:pointer;user-select:none}
.cat:hover{background:var(--card)}
.cat .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none;border:2px solid rgba(255,255,255,.85)}
.cat .lb{flex:1;font-weight:600}
.cat .ct{color:var(--mute);font-size:13px;min-width:28px;text-align:right}
.cat input{width:20px;height:20px;accent-color:var(--a)}
.cat.off .ic{filter:grayscale(1);opacity:.45}.cat.off .lb{color:var(--mute)}
@media (max-width:700px){#panel{top:auto;height:72vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}#panel.open{transform:none}header .ttl small{display:none}header .ttl{font-size:16px}}
/* pins */
.pin{position:relative;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;line-height:1;background:#1E1535;border:2px solid var(--c);box-shadow:0 3px 8px rgba(0,0,0,.55)}.pin:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top:6px solid var(--c);border-bottom:0}.pin.ap{border-style:dashed;opacity:.92}.pin.hl{transform:scale(1.35);z-index:9}
.cl{display:grid;place-items:center;border-radius:50%;font:800 14px Figtree,sans-serif;color:#3A0F4A;background:#E3B8F2;box-shadow:0 0 0 6px rgba(227,184,242,.4),0 4px 10px rgba(0,0,0,.45)}.cl.m{background:#C26FDC;color:#fff;box-shadow:0 0 0 7px rgba(194,111,220,.4),0 4px 10px rgba(0,0,0,.45)}.cl.l{background:#B13ED8;color:#fff;box-shadow:0 0 0 8px rgba(177,62,216,.42),0 4px 10px rgba(0,0,0,.45)}
.cat-g{margin:12px 8px 4px;font:800 11px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.embed:not(.live) #map{touch-action:pan-y}
/* labels */
.lbl{white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.lbl.big{font:800 20px "Bricolage Grotesque",sans-serif;letter-spacing:.18em;color:rgba(255,241,234,.55)}
.lbl.mid{font:700 13px Figtree,sans-serif;color:#fff}
.lbl.small{font:600 11px Figtree,sans-serif;color:#FFD9C2}
.lbl.water{font:italic 600 13px Figtree,sans-serif;color:#7FB2E5;letter-spacing:.06em}
.z-lo .lbl.small{display:none}.z-hi .lbl.big{opacity:.35}
/* popup */
.leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:12px 14px;font:400 14px/1.45 Figtree,sans-serif;min-width:210px}
.pp-cat{display:inline-flex;gap:6px;align-items:center;font:700 11px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;color:#1A1030}
.pp h3{margin:8px 0 4px;font:800 17px/1.2 "Bricolage Grotesque",sans-serif}
.pp .z{color:var(--b);font-weight:600;font-size:13px}
.pp p{margin:6px 0 0;color:#E9DCEF}
.pp a{display:inline-block;margin-top:8px;color:var(--b);font-weight:700;text-decoration:none}
.leaflet-container a.leaflet-popup-close-button{color:var(--mute)}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(26,16,48,.7)!important;color:var(--mute)!important}
.leaflet-control-attribution a{color:var(--b)!important}

.full{position:absolute;left:12px;top:12px;z-index:1000;display:none;padding:8px 12px;border-radius:99px;background:rgba(26,16,48,.9);border:1px solid var(--line);color:var(--b);font:700 13px Figtree,sans-serif;text-decoration:none}
#app{position:fixed}
.embed header .back,.embed header .ttl{display:none}
.embed .full{display:inline-flex;top:auto;bottom:calc(18px + env(safe-area-inset-bottom));padding:12px 14px}
.embed .note{display:none}
.shield{position:absolute;inset:0;z-index:1500;display:none;place-items:center;background:rgba(10,6,22,.15);cursor:pointer}
.shield span{background:rgba(26,16,48,.92);border:1px solid var(--line);border-radius:99px;padding:10px 16px;font:700 14px Figtree,sans-serif;color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.embed .shield{display:grid}
.embed.live .shield{display:none}
</style>
</head>

al y un cromo exclusivo.", "z": "South Vice-Dale, al este de Hamlet", "u": "/easter-eggs/#nave-de-los-delincuentes", "lat": 540, "lng": 700}, {"c": "secretos", "n": "El huevo de Pascua de verdad (torre de radio)", "d": "Llega a la base de la torre y súbela por las escaleras y plataformas. La subida tarda entre 6 y 7 minutos, así que ten paciencia. Arriba, toma uno de los huevos.", "z": "South Vice-Dale, al norte de Hamlet", "u": "/easter-eggs/#huevo-de-pascua-torre", "lat": 592, "lng": 680}, {"c": "secretos", "n": "Bigfoot: el Skunk Ape de los pantanos", "d": "Escucha un rugido fuerte y sigue el rastro con la habilidad de rastreo. Te lleva hasta un árbol con forma humana (su efigie). Investígalo.", "z": "Cottonmouth Lake, Pelican Valley", "u": "/easter-eggs/#bigfoot-skunk-ape", "lat": 458.92, "lng": 564.82}, {"c": "secretos", "n": "Abducción OVNI y trofeo oculto", "d": "Después del Capítulo 1, ve de noche (mejor después de las 2:00 a. m. en el juego). Busca un coche a un lado del camino con los faros parpadeando, la cajuela abierta y ropa tirada. Sigue el resplandor azul entre los árboles y, cuando la mujer te lo pida, regresa al coche.", "z": "Al este de Port Gellhorn (Kelly)", "u": "/easter-eggs/#abduccion-ovni", "lat": 1032, "lng": 372}, {"c": "secretos", "n": "El laboratorio de cangrejos de Pelican Valley", "d": "Entra al laboratorio y resuelve el acertijo que abre la caja fuerte.", "z": "Pelican Valley, al norte de los Keys", "u": "/easter-eggs/#laboratorio-de-cangrejos", "lat": 383.92, "lng": 558.82}, {"c": "secretos", "n": "La casa OVNI de Belville", "d": "Revisa la cajuela del coche y el garaje de la casa.", "z": "Belville, Leonard", "u": "/easter-eggs/#casa-ovni-belville", "lat": 978, "lng": 762}, {"c": "secretos", "n": "Misterios que la comunidad sigue investigando", "d": "Si encuentras el teclado, introduce 2314. Para lo demás, explora la cima de Mount Kalaga y los alrededores del monumento.", "z": "Cima de Mount Kalaga, Lummox", "u": "/easter-eggs/#misterios-sin-resolver", "lat": 1280, "lng": 560}, {"c": "secretos", "n": "Cool Dog y la isla de los perros", "d": "Toma el bote del muelle de la casa de Jason, entra a Gambit Bay, tírate al agua y nada lejos de la costa. Después de unos 5 minutos solo, escucharás ladridos.", "z": "Gambit Bay, Mariana", "u": "/easter-eggs/#cool-dog-isla-de-los-perros", "lat": 300, "lng": 705}, {"c": "secretos", "n": "El loro que habla de Three Sheets Liquor", "d": "Haz el encargo del ron de Shirley. Después regresa, salta la cerca lateral (no entres por detrás del mostrador), vence a los matones y busca el loro rojo enjaulado. Revisa la rejilla de la pared junto al generador.", "z": "Three Sheets Liquor, Mariana", "u": "/easter-eggs/#loro-que-habla", "lat": 274, "lng": 652}, {"c": "secretos", "n": "El departamento de Dexter Morgan", "d": "Sube al segundo piso y ve a la unidad de la esquina, al final del pasillo.", "z": "Washington Island, Vice Beach", "u": "/easter-eggs/#departamento-de-dexter", "lat": 898, "lng": 978}, {"c": "coches", "n": "El Eclipse verde de Paul Walker", "d": "Te quedas con el coche. Abre la cajuela: hay una serpiente esperándote.", "z": "Vespucci Island, Vice Beach", "u": "/vehiculos/ocultos/#eclipse-de-paul-walker", "lat": 910, "lng": 962}, {"c": "secretos", "n": "El bote con el GPS de Los Santos", "d": "Revisa la pantalla del GPS del bote.", "z": "Casa de Jason, Key Lento", "u": "/easter-eggs/#gps-de-los-santos", "lat": 256, "lng": 628}, {"c": "secretos", "n": "La novela del vaquero de New Austin", "d": "Lee la novela del oeste que encuentres.", "z": "Jacob's Tavern, Millport", "u": "/easter-eggs/#novela-de-new-austin", "lat": 1270, "lng": 768}, {"c": "secretos", "n": "Las memorias de un mafioso de Liberty City", "d": "Lee el libro.", "z": "Casa de Jason, Key Lento", "u": "/easter-eggs/#memorias-de-liberty-city", "lat": 250, "lng": 622}, {"c": "secretos", "n": "Pintar la recámara para Lucia", "d": "Elige el color y pinta las paredes.", "z": "Casa de Jason, Key Len
