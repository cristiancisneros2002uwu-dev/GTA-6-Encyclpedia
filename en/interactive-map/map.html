<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>GTA 6 interactive map (full screen)</title>

<link rel="icon" href="/favicon.ico"/>

<style>
:root{--bg:#1A1030;--card:#271A47;--card2:#2F2055;--line:#43326F;--ink:#FFF1EA;--mute:#C3AFCB;--a:#FF6B8B;--b:#FFB36B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 Figtree,system-ui,sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(180deg,#22143f,#1A1030);border-bottom:1px solid var(--line);z-index:1000}
header a.back{color:var(--b);text-decoration:none;font-weight:700;font-size:22px;line-height:1;padding:2px 6px}
header .ttl{margin:0;font:800 18px/1.1 "Bricolage Grotesque",Figtree,sans-serif;white-space:nowrap}
header .ttl small{display:block;font:500 12px/1.2 Figtree,sans-serif;color:var(--mute)}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 15px Figtree,sans-serif;outline:none}
.search input:focus{border-color:var(--b)}
.results{position:absolute;left:0;right:0;top:46px;max-height:55vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.45);display:none}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:10px 12px;font:500 14px Figtree,sans-serif;cursor:pointer}
.results button small{color:var(--mute);display:block;font-size:12px}
.results button:hover{background:var(--card2)}
#map{flex:1;background:#1d3c6b}
.fab{position:absolute;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:1000;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:99px;border:0;background:var(--a);color:#2A0A18;font:800 15px Figtree,sans-serif;box-shadow:0 10px 26px rgba(0,0,0,.45);cursor:pointer}
.fab b{background:#2A0A18;color:var(--a);border-radius:99px;padding:1px 8px;font-size:13px}
.note{position:absolute;left:12px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:999;max-width:52%;background:rgba(26,16,48,.86);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;color:var(--mute)}
#panel{position:absolute;z-index:1001;right:0;top:0;bottom:0;width:340px;max-width:100%;background:var(--bg);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel .ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
#panel .ph h2{margin:0;font:800 18px "Bricolage Grotesque",sans-serif}
#panel .ph button{background:none;border:0;color:var(--ink);font-size:26px;cursor:pointer}
#panel .all{display:flex;gap:8px;padding:10px 16px}
#panel .all button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px Figtree,sans-serif;cursor:pointer}
#cats{overflow:auto;padding:4px 10px 24px}
.cat{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:12px;cursor:pointer;user-select:none}
.cat:hover{background:var(--card)}
.cat .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none;border:2px solid rgba(255,255,255,.85)}
.cat .lb{flex:1;font-weight:600}
.cat .ct{color:var(--mute);font-size:13px;min-width:28px;text-align:right}
.cat input{width:20px;height:20px;accent-color:var(--a)}
.cat.off .ic{filter:grayscale(1);opacity:.45}.cat.off .lb{color:var(--mute)}
@media (max-width:700px){#panel{top:auto;height:72vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}#panel.open{transform:none}header .ttl small{display:none}header .ttl{font-size:16px}}
/* pins */
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.marker-cluster div{background:var(--a)!important;color:#2A0A18;font:800 13px Figtree,sans-serif}
.marker-cluster{background:rgba(255,107,139,.35)!important}
/* labels */
.lbl{white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.lbl.big{font:800 20px "Bricolage Grotesque",sans-serif;letter-spacing:.18em;color:rgba(255,241,234,.55)}
.lbl.mid{font:700 13px Figtree,sans-serif;color:#fff}
.lbl.small{font:600 11px Figtree,sans-serif;color:#FFD9C2}
.lbl.water{font:italic 600 13px Figtree,sans-serif;color:#7FB2E5;letter-spacing:.06em}
.z-lo .lbl.small{display:none}.z-hi .lbl.big{opacity:.35}
/* popup */
.leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{margin:12px 14px;font:400 14px/1.45 Figtree,sans-serif;min-width:210px}
.pp-cat{display:inline-flex;gap:6px;align-items:center;font:700 11px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;color:#1A1030}
.pp h3{margin:8px 0 4px;font:800 17px/1.2 "Bricolage Grotesque",sans-serif}
.pp .z{color:var(--b);font-weight:600;font-size:13px}
.pp p{margin:6px 0 0;color:#E9DCEF}
.pp a{display:inline-block;margin-top:8px;color:var(--b);font-weight:700;text-decoration:none}
.leaflet-container a.leaflet-popup-close-button{color:var(--mute)}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:rgba(26,16,48,.7)!important;color:var(--mute)!important}
.leaflet-control-attribution a{color:var(--b)!important}

.full{position:absolute;left:12px;top:12px;z-index:1000;display:none;padding:8px 12px;border-radius:99px;background:rgba(26,16,48,.9);border:1px solid var(--line);color:var(--b);font:700 13px Figtree,sans-serif;text-decoration:none}
#app{position:fixed}
.embed header .back,.embed header .ttl{display:none}
.embed .full{display:inline-flex;top:auto;bottom:calc(18px + env(safe-area-inset-bottom));padding:12px 14px}
.embed .note{display:none}
.shield{position:absolute;inset:0;z-index:1500;display:none;place-items:center;background:rgba(10,6,22,.15);cursor:pointer}
.shield span{background:rgba(26,16,48,.92);border:1px solid var(--line);border-radius:99px;padding:10px 16px;font:700 14px Figtree,sans-serif;color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.embed .shield{display:grid}
.embed.live .shield{display:none}
</style>
</head>

mpeno", "n": "Vice City Pawn", "z": "Vice City", "d": "Sell your collectible cards here: some are worth $2,700.", "k": null, "u": "/en/easter-eggs/#cromos-de-2700", "lat": 720, "lng": 745}, {"c": "lugares", "n": "Starlet Motel", "z": "East of Port Gellhorn", "d": "Roadside motel. The dirt road where the UFO abduction happens is nearby.", "k": null, "u": "/en/locations/establishments/landmarks/", "lat": 1035, "lng": 362}, {"c": "lugares", "n": "Leonida prison", "z": "Hamlet", "d": "The prison Lucia walks out of at the start of the story.", "k": null, "u": "/en/locations/establishments/landmarks/", "lat": 492, "lng": 612}, {"c": "lugares", "n": "Tallest radio tower", "z": "South Vice-Dale", "d": "The tower from the first trailer. The nest with the Easter egg is at the top.", "k": null, "u": "/en/easter-eggs/#huevo-de-pascua-torre", "lat": 588, "lng": 678}, {"c": "secretos", "n": "A literal Easter egg (radio tower)", "z": "South Vice-Dale, north of Hamlet", "d": "Reach the base of the tower and climb the ladders and platforms. The climb takes 6 to 7 minutes. At the top, pick up one of the eggs.", "k": null, "u": "/en/easter-eggs/#huevo-de-pascua-torre", "lat": 592, "lng": 680}, {"c": "secretos", "n": "Bigfoot: the swamp Skunk Ape", "z": "Cottonmouth Lake, Pelican Valley", "d": "Listen for a loud roar and follow the trail with your tracking ability. It leads to a human-shaped tree (its effigy). Investigate it.", "k": null, "u": "/en/easter-eggs/#bigfoot-skunk-ape", "lat": 460, "lng": 566}, {"c": "secretos", "n": "UFO abduction and hidden trophy", "z": "East of Port Gellhorn (Kelly)", "d": "After Chapter 1, go at night (ideally after 2:00 a.m. in-game). Look for a roadside car with flickering headlights, an open trunk and clothes scattered around. Follow the blue glow into the trees and go back to the car when the woman asks you to.", "k": null, "u": "/en/easter-eggs/#abduccion-ovni", "lat": 1032, "lng": 372}, {"c": "secretos", "n": "The Pelican Valley crab lab", "z": "Pelican Valley, north of the Keys", "d": "Go inside the lab and solve the puzzle that opens the safe.", "k": null, "u": "/en/easter-eggs/#laboratorio-de-cangrejos", "lat": 385, "lng": 560}, {"c": "secretos", "n": "The Belville UFO house", "z": "Belville, Leonard", "d": "Check the car's trunk and the house's garage.", "k": null, "u": "/en/easter-eggs/#casa-ovni-belville", "lat": 978, "lng": 762}, {"c": "secretos", "n": "Mysteries the community is still working on", "z": "Top of Mount Kalaga, Lummox", "d": "If you find the keypad, enter 2314. For the rest, explore the top of Mount Kalaga and the area around the monument.", "k": null, "u": "/en/easter-eggs/#misterios-sin-resolver", "lat": 1280, "lng": 560}, {"c": "secretos", "n": "Cool Dog and Dog Island", "z": "Gambit Bay, Mariana", "d": "Take the boat from the dock at Jason's house, head into Gambit Bay, jump in and swim away from the shore. After about 5 minutes alone you'll hear barking.", "k": null, "u": "/en/easter-eggs/#cool-dog-isla-de-los-perros", "lat": 300, "lng": 705}, {"c": "secretos", "n": "The talking parrot at Three Sheets Liquor", "z": "Three Sheets Liquor, Mariana", "d": "Do Shirley's rum errand. Then come back, jump the side fence (don't go behind the counter), beat the thugs and find the caged red parrot. Check the grate in the wall next to the generator.", "k": null, "u": "/en/easter-eggs/#loro-que-habla", "lat": 274, "lng": 652}, {"c": "secretos", "n": "Dexter Morgan's apartment", "z": "Washington Island, Vice Beach", "d": "Go up to the second floor and head to the corner unit at the end of the walkway.", "k": null, "u": "/en/easter-eggs/#departamento-de-dexter", "lat": 898, "lng": 978}, {"c": "coches", "n": "Paul Walker's green Eclipse", "z": "Vespucci Island, Vice Beach", "d": "The car is yours. Open the trunk: there's a snake waiting for you.", "k": null, "u": "/en/vehicles/hidden-cars/#eclipse-de-paul-walker", "lat": 910, "lng": 962}, {"c": "secretos", "n": "The boat with a Los Santos GPS", "z" L.polygon(D.geo.outline, {color: '#F3E3C3', weight: 2.5, fillColor: '#3B5E45', fillOpacity: 1, interactive: false}).addTo(map);
D.geo.areas.forEach(a => L.polygon(a.p, {stroke: false, fillColor: a.c, fillOpacity: a.o || .9, interactive: false}).addTo(map));
D.geo.roads.forEach(r => { L.polyline(r, {color: '#0d1b33', weight: 4.5, opacity: .35, interactive: false}).addTo(map); L.polyline(r, {color: '#F7EFE2', weight: 2.2, opacity: .85, interactive: false}).addTo(map); });
D.geo.borders.forEach(b => L.polyline(b, {color: '#F3E3C3', weight: 1.5, opacity: .55, dashArray: '6 6', interactive: false}).addTo(map));
D.geo.islands.forEach(p => L.polygon(p, {color: '#F3E3C3', weight: 1.5, fillColor: '#3B5E45', fillOpacity: 1, interactive: false}).addTo(map));
L.polyline(D.geo.keys, {color: '#F3E3C3', weight: 9, opacity: 1, lineCap: 'round', interactive: false}).addTo(map);
L.polyline(D.geo.keys, {color: '#3B5E45', weight: 6, opacity: 1, lineCap: 'round', interactive: false}).addTo(map);
L.polyline(D.geo.keys, {color: '#F7EFE2', weight: 1.6, opacity: .85, dashArray: '1 0', interactive: false}).addTo(map);
D.geo.lakes.forEach(l => {
  const pts = []; for (let i = 0; i < 40; i++) { const a = i / 40 * 2 * Math.PI; pts.push([l.c[0] + l.r[0] * Math.sin(a), l.c[1] + l.r[1] * Math.cos(a)]); }
  L.polygon(pts, {color: '#0d1b33', weight: 1, fillColor: '#1d3c6b', fillOpacity: 1, interactive: false}).addTo(map);
  D.geo.labels.push({t: l.n, ll: l.c, s: 'water'});
});

D.geo.labels.forEach(l => L.marker(l.ll, {interactive: false, icon: L.divIcon({className: '', html: `<div class="lbl ${l.s}">${l.t}</div>`, iconSize: [0, 0]})}).addTo(map));
const setZ = () => { const z = map.getZoom(); const el = document.getElementById('map'); el.classList.toggle('z-lo', z < 2); el.classList.toggle('z-hi', z >= 2); };
map.on('zoomend', setZ); setZ();

// places
const cats = Object.fromEntries(D.cats.map(c => [c.id, c]));
const cluster = L.markerClusterGroup({maxClusterRadius: 38, showCoverageOnHover: false, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 4});
map.addLayer(cluster);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[m]));
const markers = D.places.map(p => {
  const c = cats[p.c];
  const m = L.marker([p.lat, p.lng], {icon: L.divIcon({className: '', html: `<div class="pin" style="background:${c.col}">${c.e}</div>`, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14]}), title: p.n});
  m.bindPopup(`<div class="pp"><span class="pp-cat" style="background:${c.col}">${c.e} ${esc(c.n)}</span><h3>${esc(p.n)}</h3><div class="z">📍 ${esc(p.z)}</div>${p.d ? `<p>${esc(p.d)}</p>` : ''}<a href="${p.u}" target="_top">See it in the encyclopedia →</a></div>`, {maxWidth: 280});
  m._p = p; return m;
});
let on = new Set(D.cats.map(c => c.id));
function render() {
  cluster.clearLayers();
  const vis = markers.filter(m => on.has(m._p.c));
  cluster.addLayers(vis);
  document.getElementById('fabc').textContent = vis.length;
  document.querySelectorAll('.cat').forEach(el => { const id = el.dataset.id; el.classList.toggle('off', !on.has(id)); el.querySelector('input').checked = on.has(id); });
}
// filters panel
const counts = {}; D.places.forEach(p => counts[p.c] = (counts[p.c] || 0) + 1);
document.getElementById('cats').innerHTML = D.cats.filter(c => counts[c.id]).map(c => `<label class="cat" data-id="${c.id}"><span class="ic" style="background:${c.col}">${c.e}</span><span class="lb">${esc(c.n)}</span><span class="ct">${counts[c.id]}</span><input type="checkbox" checked/></label>`).join('');
document.querySelectorAll('.cat input').forEach(i => i.addEventListener('change', e => { const id = e.target.closest('.cat').dataset.id; e.target.checked ? on.add(id) : on.delete(id); render(); }));
document.getElementById('allon').onclick = () => { on = new Set(D.cats.map(c => c.id)); render(); };
document.getElementById('alloff').onclick = () => { on = new Set(); render(); };
const panel = document.getElementById('panel');
document.getElementById('fab').onclick = () => panel.classList.toggle('open');
document.getElementById('close').onclick = () => panel.classList.remove('open');
render();

// search
const q = document.getElementById('q'), res = document.getElementById('res');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
q.addEventListener('input', () => {
  const t = norm(q.value.trim());
  if (t.length < 2) { res.style.display = 'none'; return; }
  const hits = markers.filter(m => norm(m._p.n + ' ' + m._p.z + ' ' + cats[m._p.c].n).includes(t)).slice(0, 30);
  res.innerHTML = hits.length ? hits.map((m, i) => `<button data-i="${markers.indexOf(m)}">${cats[m._p.c].e}<span>${esc(m._p.n)}<small>${esc(m._p.z)}</small></span></button>`).join('') : '<button disabled>No results</button>';
  res.style.display = 'block';
});
res.addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const m = markers[+b.dataset.i]; on.add(m._p.c); render();
  res.style.display = 'none'; q.value = m._p.n; q.blur(); panel.classList.remove('open');
  cluster.zoomToShowLayer(m, () => m.openPopup());
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.style.display = 'none'; });
setTimeout(() => document.getElementById('note').style.display = 'none', 9000);
if (EMBED) {
  const h = ['scrollWheelZoom', 'dragging', 'touchZoom', 'doubleClickZoom'];
  h.forEach(k => map[k].disable());
  document.getElementById('shield').addEventListener('click', () => { document.body.classList.add('live'); h.forEach(k => map[k].enable()); });
}
</script>
</body>
</html>
